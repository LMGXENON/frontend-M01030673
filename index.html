<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>After School Lessons</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f2f2f2;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .lesson {
            max-width: 350px;
            margin: 20px auto;
            background-color: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        }

        .lesson img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .lesson-info {
            padding: 15px;
        }

        .lesson-info h2 {
            margin-top: 0;
        }
    </style>
</head>

<body>
    <div id="app">
        <h1>{{ pageTitle }}</h1>
        <div class="lesson">
            <img v-bind:src="lesson.image" v-bind:alt="lesson.imageAlt">
            <div class="lesson-info">
                <h2>{{ lesson.subject }}</h2>
                <p>Location: {{ lesson.location }}</p>
                <p>Price: £{{ lesson.price }}</p>
            </div>
        </div>
    </div>

    <script type="module">
        const { createApp } = Vue

        createApp({
            data() {
                return {
                    pageTitle: "After School Lessons",
                    lesson: {
                        subject: "Maths",
                        location: "Hendon",
                        price: 100,
                        image: "images/maths.png",
                        imageAlt: "Maths lesson"
                    }
                }
            }
        }).mount("#app")
    </script>
</body>

</html>
